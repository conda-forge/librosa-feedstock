{% set version = "1.0.1" %}
{% set hash_val = "d50de0797e065bde3ccb06f8fa4ecba1" %}

package:
  name: librosa
  version: {{ version }}

source:
  fn: librosa-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/l/librosa/librosa-{{ version }}.tar.gz
  md5: {{ hash_val }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}.*
    - setuptools >=48
    - wheel >=0.29.0

  run:
    - python >={{ python_min }}
    - numpy >=2.1.3
    - scipy >=1.15.0
    - scikit-learn >=1.6.0
    - joblib >=1.2
    - matplotlib-base >=3.10.0
    - decorator >=5.2.1
    - numba >=0.61.0
    - pysoundfile >=0.12.1
    - pooch >=1.7
    - packaging >=23.2
    - soxr-python >=1.0.0
    - lazy_loader >=0.3
    - msgpack-python >=1.0.5

test:
  requires:
    - python {{ python_min }}.*
  imports:
    - librosa
    - librosa.core
    - librosa.feature
    - librosa.util
    - librosa.display

about:
  home: http://github.com/librosa/librosa
  license: ISC
  summary: Python module for audio and music processing

extra:
  recipe-maintainers:
    - bmcfee
